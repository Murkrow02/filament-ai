name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rag_test
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U rag -d rag_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      RAG_TEST_PG_HOST: 127.0.0.1
      RAG_TEST_PG_PORT: 5432
      RAG_TEST_PG_DATABASE: rag_test
      RAG_TEST_PG_USERNAME: rag
      RAG_TEST_PG_PASSWORD: rag

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, bcmath, pcntl, pdo_pgsql, pgsql, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run test suite
        run: vendor/bin/pest --colors=always
